# ══════════════════════════════════════════════════════════
# Environnement : DEV — plateforme éphémère de développement
# ══════════════════════════════════════════════════════════

# ── GCP ─────────────────────────────────────────────────────
project_id:                "slavayssiere-sandbox-462015"
base_domain:               "zenika.slavayssiere.fr"
parent_zone_name:          "slavayssiere-zenika"
parent_zone_project_id:    "slavayssiere-sandbox-462015"
bq_location:               "europe-west1"  # Obligatoire depuis P2-2 (plus de défault dans variables.tf)

# ── Registre d'images ─────────────────────────────────────
# manage_env.py assemble : {image_registry}/{service}:{version}
# Les versions sont lues depuis les fichiers VERSION locaux (mis à jour par deploy.sh)
image_registry: "europe-west1-docker.pkg.dev/slavayssiere-sandbox-462015/z-gcp-summit-services-dev"

# ── Cloud Run ─────────────────────────────────────────────
cloudrun_min_instances: 1
cloudrun_max_instances: 10
cloudrun_concurrency: 500

# ── AlloyDB ───────────────────────────────────────────────
alloydb_cpu: 2   # Minimum pour le type custom AlloyDB

# ── Sécurité / WAF ────────────────────────────────────────
waf_rate_limit: 2000

# ── Administration ─────────────────────────────────────────
admin_user:               "sebastien.lavayssiere@zenika.com"
finops_anomaly_threshold: 500000

# Liste des emails notifiés par les alertes SRE GCP (Cloud Monitoring)
# Utilisée par Terraform (alerting.tf) pour créer les notification_channels.
sre_alert_emails:
  - "sebastien.lavayssiere@zenika.com"

# ── IA / Modèles (per-agent, AGENTS.md §1.4) ──────────────────────────────
# Migration 2026-05-12 : gemini-3.1-flash-lite est passé GA (sans -preview).
# gemini-3.1-pro reste en preview (pas de GA 3.1-pro disponible).
gemini_router_model:       "gemini-3.5-flash"               # Orchestrateur : raisonnement complexe GA (Gemini 3.5 Flash)
gemini_hr_model:           "gemini-3.1-flash-lite"          # RH : RAG + MCP
gemini_ops_model:          "gemini-3.1-flash-lite"          # Ops : SQL + logs
gemini_missions_model:     "gemini-3.1-flash-lite"          # Missions : matching staffing
gemini_cv_model:           "gemini-3.1-flash-lite"          # CV API : extraction JSON contrainte
gemini_pro_model:          "gemini-2.5-pro"                 # Taxonomy Reduce (Vertex AI Batch — Flash en dev)
gemini_batch_model:        "gemini-2.5-flash"               # Taxonomy Map+Sweep (Vertex AI Batch — Flash en dev)
gemini_model:              "gemini-3.1-flash-lite"          # [LEGACY] fallback
gemini_embedding_model:    "gemini-embedding-001"           # SEC-F06 Semantic Cache
trace_sampling_rate: 1.0
enable_output_schema: false  # Activer pour output_schema Pydantic (StaffingResponse/MissionAnalysis) comme source de vérité display_type

# ── Projets externes (optionnel) ──────────────────────────────────────────────
# Permet d'intégrer des projets hors mono-repo dans le cycle de déploiement de la plateforme.
# Chaque projet doit respecter la structure minimale suivante :
#   <path>/
#   ├── Dockerfile          (image Docker du service)
#   ├── database/           (migrations Liquibase)
#   └── terraform/          (modules Terraform pour le déploiement Cloud Run)
#
# Contraintes de nommage :
#   - name             : kebab-case, regex ^[a-z][a-z0-9-]{2,30}$  (ex: ia-dev-memory)
#   - lb_path          : chemin LB commençant par '/'               (ex: /ia-dev-memory)
#   - version          : semver strict                              (ex: v0.1.0)
#   - alloydb_database : nom de la base PostgreSQL (défaut: name avec tirets→underscores)
#
# La plateforme crée automatiquement :
#   - un utilisateur IAM AlloyDB (Service Account du projet externe)
#   - les rôles alloydb.client + alloydb.databaseUser sur le projet GCP
#
extra_projects:
  - name: mcp-claude-memory
    path: /Users/sebastien.lavayssiere/Code/MCP-Claude-mem-local
    lb_path: /mcp-claude-memory
    version: v1.0.24
    db_migrations_version: v1.0.23
    alloydb_database: mcp_claude_memory
    token_iap: true
    health_check_paths:
      - /mcp-claude-memory/health
      - /mcp-claude-memory/ready
      - /mcp-claude-memory/mcp/tools
